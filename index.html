<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4b1e44" />
  <meta name="description" content="Mira Media proposal for the Hamdan Street liveboard, beside Al Maryah Island." />
  <title>Mira Media</title>
  <link rel="icon" href="assets/mira-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="pitch">
  <a class="skip-link" href="#slide-stage">Skip to slide</a>

  <div class="deck" id="deck">
    <main class="slide-stage" id="slide-stage" tabindex="-1"></main>

    <nav class="pitch-nav" aria-label="Slide navigation">
      <button type="button" class="pitch-arrow" id="prev-btn" aria-label="Previous" disabled>‹</button>
      <div class="pitch-dots" id="pitch-dots"></div>
      <button type="button" class="pitch-arrow" id="next-btn" aria-label="Next">›</button>
      <span class="pitch-count" id="slide-counter">01 / 10</span>
      <button type="button" class="pitch-icon" id="overview-btn" aria-label="All slides" title="All slides">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="1" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button type="button" class="pitch-icon" id="print-btn" aria-label="Print or save PDF" title="Print / PDF">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4 6V2h10v4M4 12H2V7h14v5h-2M4 14h10v2H4v-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
  </div>

  <div id="print-root" class="print-root" hidden aria-hidden="true"></div>

  <dialog class="overview-dialog" id="overview-dialog" aria-labelledby="overview-title">
    <div class="overview-head">
      <h2 id="overview-title">All slides</h2>
      <button type="button" class="icon-btn" id="overview-close" aria-label="Close">✕</button>
    </div>
    <div class="overview-grid" id="overview-grid"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
